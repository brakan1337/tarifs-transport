spring.application.name=tarifs-transport

# Par défaut, une base H2 en mémoire qui imite PostgreSQL : rien à installer pour essayer.
# Le profil « postgres » (application-postgres.properties) branche une vraie base.
spring.datasource.url=jdbc:h2:mem:tarifs;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Flyway crée les tables ; Hibernate vérifie seulement qu'elles correspondent au code.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
