name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API Java (H2 puis PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tarifs
          POSTGRES_USER: tarifs
          POSTGRES_PASSWORD: tarifs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tarifs -d tarifs"
          --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests sur H2
        run: ./mvnw -B verify
      - name: Tests sur une vraie base PostgreSQL
        run: ./mvnw -B test
        env:
          SPRING_PROFILES_ACTIVE: postgres
          DB_URL: jdbc:postgresql://localhost:5432/tarifs

  interface:
    name: Interface Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npx ng test --watch=false
      - name: Compilation de production
        run: npx ng build

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [api, interface]
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t tarifs-transport .
